name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: astrynn
          POSTGRES_PASSWORD: astrynn_ci_only
          POSTGRES_DB: astrynn_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U astrynn -d astrynn_test"
          --health-interval=2s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e . ruff==0.16.0 pytest

      - name: Ruff lint
        run: ruff check .

      - name: Pytest
        env:
          ASTRYNN_POSTGRES_TEST_URL: >-
            postgresql+psycopg://astrynn:astrynn_ci_only@127.0.0.1:5432/astrynn_test
        run: pytest -q
