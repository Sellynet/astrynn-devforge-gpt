name: One-shot Verification 46 Evidence Append

on:
  push:
    branches:
      - feat/api-hardening-46
    paths:
      - ".github/workflows/one-shot-verification-46.yml"

permissions:
  contents: write

jobs:
  append-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/api-hardening-46

      - name: Append immutable hardening evidence once
        shell: bash
        run: |
          set -euo pipefail
          marker="API hardening #46 · PR #54 · 2026-08-20"
          if ! grep -Fq "$marker" VERIFICATION.md; then
            cat >> VERIFICATION.md <<'EOF'

## API hardening #46 · PR #54 · 2026-08-20

Classification: `FUNCIONA VERIFICADO · SIX-WORKFLOW PR GATE GREEN`.

Scope verified on branch `feat/api-hardening-46`:

- `/health` reduced to minimal availability metadata;
- `/status` added for bounded non-sensitive operational metadata;
- UUID `X-Request-ID` generated or propagated per request and returned on responses;
- baseline security headers applied and covered by HTTP tests;
- CORS wildcard explicitly absent;
- historical Block 0 persistence consumers migrated from `/health` to `/status` without weakening their checks.

Evidence on head `a80a36003e9100f0a266eda47962f35d1b7586bd`:

- CI — Run ID `32409257031` / run `111` — `SUCCESS`;
- Block 0 Human Verification — Run ID `32409257024` / run `24` — `SUCCESS`;
- Block 0 Remaining Endpoint Verification — Run ID `32409257071` / run `24` — `SUCCESS`;
- Block 0 Deliberate Negative Verification — Run ID `32409257374` / run `23` — `SUCCESS`;
- Block 0 Restart Persistence Verification — Run ID `32409257032` / run `24` — `SUCCESS`;
- Block 0 README Clean-room Verification — Run ID `32409257183` / run `20` — `SUCCESS`.

CI principal: Python `3.11.16`; Ruff `0.16.0` → `All checks passed!`; PostgreSQL `16-alpine` healthy; pytest `131 passed in 4.02s`.

Permanent detailed evidence: `docs/verification/API_HARDENING_46_2026-08-20.md`.

Boundary: this closes the technical hardening evidence for issue #46 only. It does **not** establish production identity lifecycle, secret rotation, RLS, backup/restore/DR, runtime enforcement, external-traffic authorization, `PILOT READY` or `PRODUCTION READY`. Atlas remains C3 pending the full independent C4 re-gate.
EOF
          fi
          rm -f .github/workflows/one-shot-verification-46.yml

      - name: Commit evidence and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERIFICATION.md .github/workflows/one-shot-verification-46.yml
          if git diff --cached --quiet; then
            echo "No changes required"
            exit 0
          fi
          git commit -m "docs: record API hardening 46 verification evidence"
          git push origin HEAD:feat/api-hardening-46
